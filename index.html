<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SV Room Editor</title>
  </head>
  <body>
    <header id="appbar">
      <span class="brand"><span class="brand-logo" data-icon="logo"></span>SV Room Editor</span>
      <select id="room-select" title="房间"></select>
      <button id="b-new" title="基于一个原版房间新建">新建…</button>
      <div class="sep"></div>
      <button id="b-undo" class="icon-btn" data-icon="undo" title="撤销 (Ctrl+Z)" disabled></button>
      <button id="b-redo" class="icon-btn" data-icon="redo" title="重做 (Ctrl+Y)" disabled></button>
      <span class="spacer"></span>
      <span id="load-state"></span>
      <button id="b-compile" title="把工程编译成 Codes/&lt;房间&gt;.gml（Ctrl+S）" disabled>编译</button>
    </header>
    <div id="options">
      <span id="opt-tool">选择</span>
      <span id="opt-extra"></span>
      <div class="sep"></div>
      <label class="itoggle" title="吸附：拖动与放置按 26px 格对齐；按住 Alt 临时自由 (S)"><input type="checkbox" id="t-snap" checked /><i data-icon="snap"></i></label>
      <label class="itoggle" title="隐形对象 (Shift+H)"><input type="checkbox" id="t-hidden" checked /><i data-icon="eye"></i></label>
      <label class="itoggle" title="碰撞/屏障格"><input type="checkbox" id="t-collision" checked /><i data-icon="collision"></i></label>
      <label class="itoggle" title="标记点"><input type="checkbox" id="t-markers" /><i data-icon="markers"></i></label>
      <label class="itoggle" title="网格 (G)"><input type="checkbox" id="t-grid" /><i data-icon="grid"></i></label>
      <label class="itoggle" title="便签"><input type="checkbox" id="t-notes" checked /><i data-icon="note"></i></label>
      <span class="spacer"></span>
      <button id="b-zoom-out" class="icon-btn" data-icon="zoomOut" title="缩小 (-)"></button>
      <select id="zoom-preset" title="缩放">
        <option value="" id="zoom-cur" hidden>100%</option>
        <option value="25">25%</option>
        <option value="50">50%</option>
        <option value="100">100%</option>
        <option value="200">200%</option>
        <option value="300">300%</option>
        <option value="400">400%</option>
        <option value="800">800%</option>
        <option value="fit">适配窗口</option>
      </select>
      <button id="b-zoom-in" class="icon-btn" data-icon="zoomIn" title="放大 (+)"></button>
      <div class="sep"></div>
      <button id="b-fit" title="适配窗口 (F / Ctrl+0)">适配</button>
      <button id="b-1x" title="实际像素 (1 / Ctrl+1)">1:1</button>
    </div>
    <div id="banner" hidden></div>
    <main>
      <nav id="toolbox">
        <button data-tool="select" class="on" data-icon="select" title="选择 (V)" aria-pressed="true"></button>
        <button data-tool="hand" data-icon="hand" title="抓手 (H)：拖动平移；空格临时切换" aria-pressed="false"></button>
        <button data-tool="place" data-icon="place" title="放置 (P)：在「对象」页签挑选，单击放入" aria-pressed="false"></button>
        <div class="tsep"></div>
        <button data-tool="collision" data-icon="bucket" title="碰撞涂刷 (C)：拖动刷 o_hut_wall 碰撞格；Alt+拖动 = 擦除" aria-pressed="false"></button>
        <button data-tool="barrier" data-icon="wall" title="屏障涂刷 (B)：拖动刷 o_projectileBarrier 屏障格（挡箭/投掷物）；Alt+拖动 = 擦除" aria-pressed="false"></button>
        <button data-tool="zone" data-icon="zone" title="区域 (T)：拖出一个矩形（Trigger/相机/表面等纯色盒功能对象），在选项栏换对象" aria-pressed="false"></button>
        <button data-tool="marker" data-icon="markers" title="标记 (M)：单击放出生点/灯光等功能标记，在选项栏换对象" aria-pressed="false"></button>
        <div class="tsep"></div>
        <button data-tool="note" data-icon="note" title="便签 (N)：单击在那个位置留便签" aria-pressed="false"></button>
      </nav>
      <div id="canvas-area">
        <div id="ruler-corner"></div>
        <canvas id="ruler-x"></canvas>
        <canvas id="ruler-y"></canvas>
        <section id="stage"></section>
      </div>
      <aside id="dock">
        <section class="dock-panel" id="p-props">
          <div class="dock-head" data-collapse="props"><span class="chev" data-icon="chevron"></span>属性</div>
          <div class="dock-body"><div id="inspect-body" class="muted">点选一个实例</div></div>
        </section>
        <section class="dock-panel dock-tabs">
          <nav class="tabs">
            <button data-tab="insts" class="on" title="实例图层：每个实例一行，按遮挡顺序排列；拖动调序，眼睛 = 编辑器内隐藏">图层</button>
            <button data-tab="layers" title="GameMaker 图层（分组）：放置目标层与整层显隐">层组</button>
            <button data-tab="palette">对象</button>
            <button data-tab="history">历史<span id="history-badge"></span></button>
          </nav>
          <section id="tab-insts">
            <div class="palette-head"><input id="insts-q" type="search" placeholder="筛选实例名或 #id…" autocomplete="off" /></div>
            <ul id="inst-list"></ul>
          </section>
          <section id="tab-layers" hidden><ul id="layer-list"></ul></section>
          <section id="tab-palette" hidden>
            <div class="palette-head">
              <input id="palette-q" type="search" placeholder="搜索对象名…  (Ctrl+K)" autocomplete="off" />
              <div id="palette-families"></div>
            </div>
            <ul id="palette-list"></ul>
          </section>
          <section id="tab-history" hidden>
            <div id="notes-list"></div>
            <ul id="history-list"></ul>
          </section>
        </section>
      </aside>
    </main>
    <footer id="status">
      <span id="s-tool">选择</span>
      <span id="s-pos">—</span>
      <span id="s-cell">—</span>
      <span id="s-zoom">—</span>
      <span id="s-hover" class="grow">—</span>
      <span id="s-hint">V 选择 · H 抓手 · P 放置 · C 碰撞 · B 屏障 · T 区域 · M 标记 · N 便签 · 空格/右键拖=平移 · Shift+H 隐形 · G 网格 · S 吸附 · F 适配</span>
    </footer>
    <div id="toasts"></div>
    <dialog id="new-dialog">
      <form method="dialog" class="form">
        <div class="insp-title" style="grid-column: 1 / -1">新建房间</div>
        <label>房间名</label><input id="nd-name" placeholder="r_sv_something" spellcheck="false" />
        <label>原版基底</label><input id="nd-q" placeholder="搜索原版房间名…" spellcheck="false" />
        <label></label><select id="nd-base" size="8"></select>
        <label>内容</label>
        <select id="nd-keep"><option value="all">复制全部实例（在原版上加工）</option><option value="controllers">只留控制器（用原版美术从头搭）</option></select>
        <label></label>
        <div style="display:flex; gap:8px; justify-content:flex-end">
          <button value="cancel">取消</button><button id="nd-ok" value="ok" class="primary">创建</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
