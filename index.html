<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SV Room Editor</title>
  </head>
  <body>
    <header id="appbar">
      <span class="brand"><span class="brand-logo" data-icon="logo"></span>SV Room Editor</span>
      <select id="room-select" title="房间"></select>
      <button id="b-new" title="基于一个原版房间新建">新建…</button>
      <div class="sep"></div>
      <button id="b-undo" class="icon-btn" data-icon="undo" title="撤销 (Ctrl+Z)" disabled></button>
      <button id="b-redo" class="icon-btn" data-icon="redo" title="重做 (Ctrl+Y)" disabled></button>
      <span class="spacer"></span>
      <span id="load-state"></span>
      <button id="b-compile" title="编译工程：重放日志生成编译快照，并同步 Rooms.g.cs（Ctrl+S）" disabled>编译</button>
    </header>
    <div id="options">
      <span id="opt-tool">选择</span>
      <span id="opt-extra"></span>
      <div class="sep"></div>
      <label class="itoggle" title="吸附：拖动与放置按 26px 格对齐；按住 Alt 临时自由 (S)"><input type="checkbox" id="t-snap" checked /><i data-icon="snap"></i><span class="txt">吸附</span></label>
      <label class="itoggle" title="隐形对象 (Shift+H)"><input type="checkbox" id="t-hidden" checked /><i data-icon="eye"></i><span class="txt">隐形</span></label>
      <label class="itoggle" title="碰撞格"><input type="checkbox" id="t-collision" checked /><i data-icon="collision"></i><span class="txt">碰撞</span></label>
      <label class="itoggle" title="标记点"><input type="checkbox" id="t-markers" /><i data-icon="markers"></i><span class="txt">标记</span></label>
      <label class="itoggle" title="网格 (G)"><input type="checkbox" id="t-grid" /><i data-icon="grid"></i><span class="txt">网格</span></label>
      <label class="itoggle" title="便签"><input type="checkbox" id="t-notes" checked /><i data-icon="note"></i><span class="txt">便签</span></label>
      <button id="b-zmode" title="画布排序方式：&#10;游戏 = 模拟运行时 depth（游戏内真实遮挡；选中实例始终置顶，松开回到真实顺序）&#10;静态 = UTMT 视角（图层 depth + 数组顺序，用于对账）">顺序：游戏</button>
      <span class="spacer"></span>
      <button id="b-zoom-out" class="icon-btn" title="缩小 (-)"><i data-icon="zoomOut"></i><span class="txt">缩小</span></button>
      <select id="zoom-preset" title="缩放">
        <option value="" id="zoom-cur" hidden>100%</option>
        <option value="25">25%</option>
        <option value="50">50%</option>
        <option value="100">100%</option>
        <option value="200">200%</option>
        <option value="300">300%</option>
        <option value="400">400%</option>
        <option value="800">800%</option>
        <option value="fit">适配窗口</option>
      </select>
      <button id="b-zoom-in" class="icon-btn" title="放大 (+)"><i data-icon="zoomIn"></i><span class="txt">放大</span></button>
      <div class="sep"></div>
      <button id="b-fit" title="适配窗口 (F / Ctrl+0)">适配</button>
      <button id="b-1x" title="实际像素 (1 / Ctrl+1)">1:1</button>
    </div>
    <div id="banner" hidden></div>
    <main>
      <nav id="toolbox">
        <button data-tool="select" class="on" title="选择 (V)" aria-pressed="true"><i data-icon="select"></i><span class="txt">选择</span></button>
        <button data-tool="hand" title="抓手 (H)：拖动平移；空格临时切换" aria-pressed="false"><i data-icon="hand"></i><span class="txt">抓手</span></button>
        <button data-tool="place" title="放置 (P)：在「对象」页签挑选，单击放入" aria-pressed="false"><i data-icon="place"></i><span class="txt">放置</span></button>
        <div class="tsep"></div>
        <button data-tool="collision" title="碰撞矩形 (C)：拖出 o_hut_wall 碰撞矩形（边吸附格线，尺寸恒为整数格；按住 Alt 自由调整）；单击：光标所在格" aria-pressed="false"><i data-icon="rect"></i><span class="txt">碰撞</span></button>
        <button data-tool="barrier" title="屏障涂刷 (B)：拖动涂刷 o_projectileBarrier 屏障格（阻挡箭矢与投掷物）；Alt+拖动擦除" aria-pressed="false"><i data-icon="wall"></i><span class="txt">屏障</span></button>
        <button data-tool="zone" title="区域 (T)：拖出一个矩形（Trigger/相机/表面等纯色盒功能对象），在选项栏换对象" aria-pressed="false"><i data-icon="zone"></i><span class="txt">区域</span></button>
        <button data-tool="marker" title="标记 (M)：单击放出生点/灯光等功能标记，在选项栏换对象" aria-pressed="false"><i data-icon="markers"></i><span class="txt">标记</span></button>
        <div class="tsep"></div>
        <button data-tool="note" title="便签 (N)：单击在那个位置留便签" aria-pressed="false"><i data-icon="note"></i><span class="txt">便签</span></button>
      </nav>
      <div id="canvas-area">
        <div id="ruler-corner"></div>
        <canvas id="ruler-x"></canvas>
        <canvas id="ruler-y"></canvas>
        <section id="stage"></section>
      </div>
      <aside id="dock">
        <section class="dock-panel" id="p-props">
          <div class="dock-head" data-collapse="props"><span class="chev" data-icon="chevron"></span>属性</div>
          <div class="dock-body"><div id="inspect-body" class="muted">点选一个实例</div></div>
        </section>
        <section class="dock-panel dock-tabs">
          <nav class="tabs">
            <button data-tab="insts" class="on" title="实例图层：每个实例一行，按图层数组顺序排列（靠上 = 静态视图里画在前面）；拖动调整顺序，眼睛图标控制编辑器内显隐；带 d 徽标的行游戏内由 depth 代码排序">图层</button>
            <button data-tab="layers" title="GameMaker 图层（分组）：放置目标层与整层显隐">层组</button>
            <button data-tab="history">历史<span id="history-badge"></span></button>
          </nav>
          <section id="tab-insts">
            <div class="palette-head"><input id="insts-q" type="search" placeholder="筛选实例名或 #id…" autocomplete="off" /></div>
            <ul id="inst-list"></ul>
          </section>
          <section id="tab-layers" hidden><ul id="layer-list"></ul></section>
          <section id="tab-history" hidden>
            <div id="notes-list"></div>
            <ul id="history-list"></ul>
          </section>
        </section>
      </aside>
    </main>
    <footer id="status">
      <span id="s-tool">选择</span>
      <span id="s-pos">—</span>
      <span id="s-cell">—</span>
      <span id="s-zoom">—</span>
      <span id="s-hover" class="grow">—</span>
      <span id="s-hint">V 选择 · H 抓手 · P 放置 · C 碰撞 · B 屏障 · T 区域 · M 标记 · N 便签 · 空格/右键拖动平移 · Shift+H 隐形 · G 网格 · S 吸附 · F 适配</span>
    </footer>
    <div id="toasts"></div>
    <dialog id="palette-dialog">
      <div class="pd-head">
        <input id="palette-q" type="search" placeholder="筛选对象名…  (Enter 放第一个 · Esc 关闭)" autocomplete="off" />
        <div id="palette-families"></div>
      </div>
      <div class="pd-body">
        <div id="palette-room-wrap" hidden>
          <div class="plib-head">本房间已有 · 点击再放一个</div>
          <div id="palette-room"></div>
        </div>
        <div class="plib-head">对象库 · 不在本房间 · 点击后在画布上单击放入</div>
        <ul id="palette-list"></ul>
      </div>
      <div id="palette-info" class="plib-info">对象库 = 游戏与 mod 的全部对象定义，不是本房间内容</div>
    </dialog>
    <dialog id="new-dialog">
      <form method="dialog" class="form">
        <div class="insp-title" style="grid-column: 1 / -1">新建房间</div>
        <label>房间名</label><input id="nd-name" placeholder="r_sv_something" spellcheck="false" />
        <label>原版基底</label><input id="nd-q" placeholder="搜索原版房间名…" spellcheck="false" />
        <label></label><select id="nd-base" size="8"></select>
        <label>内容</label>
        <select id="nd-keep"><option value="all">复制全部实例（在原版基础上修改）</option><option value="controllers">只留控制器（保留原版美术，自行布置）</option></select>
        <label></label>
        <div style="display:flex; gap:8px; justify-content:flex-end">
          <button value="cancel">取消</button><button id="nd-ok" value="ok" class="primary">创建</button>
        </div>
      </form>
    </dialog>
    <dialog id="vanilla-dialog">
      <form method="dialog" class="form">
        <div class="insp-title" style="grid-column: 1 / -1">打开原版房间（只读）</div>
        <label>搜索</label><input id="vd-q" placeholder="搜索原版房间名…  (Enter 打开第一个)" spellcheck="false" autocomplete="off" />
        <label></label><select id="vd-list" size="10"></select>
        <label></label>
        <div style="display:flex; gap:8px; justify-content:flex-end">
          <button value="cancel">取消</button><button id="vd-ok" value="ok" class="primary">打开（只读）</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
